[project]
name = "wrytely-agent"
version = "0.1.0"
description = "Persistent personal academic agent powered by Meta models"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic-settings>=2.6,<3",
  "httpx>=0.28,<1", "psycopg[binary]>=3.2,<4", "openai>=1.100,<3", "pyjwt[crypto]>=2.10,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.12,<1", "pgserver==0.1.4; sys_platform == 'darwin'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "contracts", "shared", "runtime", "integrations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["live: requires explicit live credentials and incurs provider usage"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
